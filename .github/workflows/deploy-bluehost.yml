name: Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build:static

      - name: Upload to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_HOST }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          local-dir: ./dist/client/
          server-dir: ${{ secrets.BLUEHOST_REMOTE_DIR }}

  deploy-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase Edge Functions
        run: |
          supabase functions deploy admin-create-user --project-ref ghybwdbjflzqjnhfqmzn
          supabase functions deploy meta-oauth --project-ref ghybwdbjflzqjnhfqmzn
          supabase functions deploy meta-oauth-callback --project-ref ghybwdbjflzqjnhfqmzn --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
